[workspace]
resolver = "3"
members = ["crates/sim", "crates/app", "crates/mapdata", "crates/mapbake"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# Local Bevy 0.19.0 source (../bevy). Do not edit engine code unless unavoidable.
bevy = { path = "../bevy", default-features = false, features = ["2d", "ui"] }
bevy_ecs = { path = "../bevy/crates/bevy_ecs" }
sim = { path = "crates/sim" }
mapdata = { path = "crates/mapdata" }
mapbake = { path = "crates/mapbake" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# Bevy recommends optimizing dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
