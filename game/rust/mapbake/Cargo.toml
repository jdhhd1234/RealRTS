[package]
name = "mapbake"
edition.workspace = true
version.workspace = true

# QGIS GeoPackage (.gpkg) -> mapdata::Baked. Library for the game's File > Open, binary for offline baking.
[dependencies]
mapdata.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0.154"
# encoding_rs: honor .cpg code pages (e.g. CP949 attribute text).
shapefile = { version = "0.9.0", features = ["encoding_rs"] }
